<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1040" height="520" rx="18" fill="#f4f2ec"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b423d"/></marker>
  </defs>

  <g font-size="13" fill="#141815">
    <rect x="30" y="60" width="190" height="78" rx="12" fill="#fbfaf7" stroke="#d3cfc3"/>
    <text x="48" y="92" font-weight="600">Borrower web</text>
    <text x="48" y="114" fill="#6f776f" font-size="12">apply · offer · pay</text>

    <rect x="30" y="170" width="190" height="78" rx="12" fill="#fbfaf7" stroke="#d3cfc3"/>
    <text x="48" y="202" font-weight="600">Staff console</text>
    <text x="48" y="224" fill="#6f776f" font-size="12">review · collect · audit</text>

    <rect x="30" y="330" width="190" height="78" rx="12" fill="#fbfaf7" stroke="#d3cfc3"/>
    <text x="48" y="362" font-weight="600">Paystack</text>
    <text x="48" y="384" fill="#6f776f" font-size="12">cards · transfers · webhooks</text>

    <rect x="30" y="430" width="190" height="62" rx="12" fill="#fbfaf7" stroke="#d3cfc3"/>
    <text x="48" y="458" font-weight="600">Credit bureau</text>
    <text x="48" y="478" fill="#6f776f" font-size="12">score · arrears · obligations</text>
  </g>

  <rect x="270" y="60" width="150" height="188" rx="12" fill="#141815"/>
  <text x="290" y="92" fill="#c8f169" font-size="13" font-weight="600">Next.js 16</text>
  <text x="290" y="114" fill="#fbfaf7" font-size="12" opacity=".7">/api/* proxied</text>
  <text x="290" y="132" fill="#fbfaf7" font-size="12" opacity=".7">httpOnly session</text>
  <text x="290" y="150" fill="#fbfaf7" font-size="12" opacity=".7">cookie, SameSite</text>

  <rect x="470" y="40" width="330" height="460" rx="16" fill="#fbfaf7" stroke="#0f6b4f" stroke-width="1.5"/>
  <text x="490" y="70" font-size="14" font-weight="700" fill="#0f6b4f">Spring Boot 4.2 · Java 25</text>
  <g font-size="12.5" fill="#141815">
    <rect x="490" y="88" width="290" height="62" rx="10" fill="#dcefe4"/>
    <text x="506" y="112" font-weight="600">Origination</text>
    <text x="506" y="132" fill="#3b423d">decision engine · maker-checker · offers</text>

    <rect x="490" y="162" width="290" height="62" rx="10" fill="#dcefe4"/>
    <text x="506" y="186" font-weight="600">Loans</text>
    <text x="506" y="206" fill="#3b423d">amortisation · disbursement · allocation</text>

    <rect x="490" y="236" width="290" height="62" rx="10" fill="#dcefe4"/>
    <text x="506" y="260" font-weight="600">End of day</text>
    <text x="506" y="280" fill="#3b423d">card debits · late fees · DPD buckets</text>

    <rect x="490" y="310" width="290" height="62" rx="10" fill="#dcefe4"/>
    <text x="506" y="334" font-weight="600">Payments</text>
    <text x="506" y="354" fill="#3b423d">gateway port · HMAC webhooks · sandbox</text>

    <rect x="490" y="384" width="290" height="62" rx="10" fill="#e1e9f8"/>
    <text x="506" y="408" font-weight="600">Audit + console reporting</text>
    <text x="506" y="428" fill="#3b423d">PAR, funnel, collections, timeline</text>
  </g>

  <rect x="850" y="120" width="160" height="300" rx="14" fill="#141815"/>
  <text x="870" y="150" fill="#c8f169" font-size="13" font-weight="600">PostgreSQL 18</text>
  <g font-size="12" fill="#fbfaf7" opacity=".8">
    <text x="870" y="180">applications</text>
    <text x="870" y="200">decisions *</text>
    <text x="870" y="220">loans · installments</text>
    <text x="870" y="240">repayments *</text>
    <text x="870" y="260">allocations *</text>
    <text x="870" y="280">debit_attempts</text>
    <text x="870" y="300">loan_events *</text>
    <text x="870" y="320">audit_events *</text>
    <text x="870" y="340">business_days</text>
  </g>
  <text x="870" y="380" fill="#c8f169" font-size="11">* append-only triggers</text>
  <text x="870" y="398" fill="#c8f169" font-size="11">CHECKs on every balance</text>

  <g stroke="#3b423d" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M220 99H266"/>
    <path d="M220 209H266"/>
    <path d="M420 154H466"/>
    <path d="M800 270H846"/>
    <path d="M466 341H224"/>
