name: credline

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: credline
      POSTGRES_PASSWORD: credline
      POSTGRES_DB: credline
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credline"]
      interval: 2s
      retries: 30

  api:
    build: ./api
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/credline
      AUTH_SECRET: ${AUTH_SECRET:-local-compose-secret-change-me-0123456789}
      PUBLIC_URL: http://localhost:3001
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 3s
      retries: 60

  web:
    build:
      context: ./web
      args:
        API_URL: http://api:8080
    ports:
      - "3001:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
